# OrderFlow continuous integration — stub.
# The trigger is configured; the steps that restore, build and run the smoke tests
# are left for you to complete (see Laboratory Work 2).
name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore OrderFlow.slnx
      - name: Build
        run: dotnet build OrderFlow.slnx --no-restore
      - name: Test
        run: dotnet test OrderFlow.slnx --no-build --no-restore
